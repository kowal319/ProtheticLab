<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .card-footer {
            background-color: transparent;
        }
    </style>
</head>

<body>
<!-- Navbar -->
<div th:replace="admin/navbar ::header"></div>
<div th:replace="admin/navbar ::navbar"></div>

<!-- Main Content -->
<div class="container mt-5">
    <h1 class="text-center text-primary"><i class="fa fa-cogs"></i> Centrum Zarządzania</h1>

    <!-- Management Card -->
    <div class="card mt-4">
        <div class="card-header text-center">
            <h2 class="card-title text-secondary">Panel Administracyjny</h2>
        </div>

        <div class="card-footer">
            <div class="btn-group">
                <a th:href="@{admin/orders}" class="btn btn-primary">
                    <i class="fas fa-list"></i> Zamówienia
                </a>
                <a th:href="@{admin/users}" class="btn btn-primary">
                    <i class="fas fa-users"></i> Użytkownicy
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap & Font Awesome JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
