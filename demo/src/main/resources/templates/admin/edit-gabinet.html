<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Edit User</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
  <style>
    .card {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin-top: 30px;
    }
  </style>
</head>
<div th:replace="gabinet/navbar ::header"></div>

<body>
<div th:replace="gabinet/navbar ::navbar"></div>
<br />

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Edytuj Profil Gabinetu</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" method="post">
            <div class="form-group">
              <label for="name">Nazwa gabinetu</label>
              <input type="text" class="form-control" id="name" name="name" required th:value="${user.name}" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="text" class="form-control" id="email" name="email" th:value="${user.email}" />
            </div>
            <div class="form-group">
              <label for="phoneNumber">Numer Kontaktowy</label>
              <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" />
            </div>
            <div class="form-group">
              <label for="address">Adres</label>
              <input type="text" class="form-control" id="address" name="address" th:value="${user.address}" />
            </div>
            <div class="form-group">
              <label for="openingHours">Godziny Otwarcia</label>
              <input type="text" class="form-control" id="openingHours" name="openingHours" th:value="${user.openingHours}" />
            </div>
            <button type="submit" class="btn btn-primary">Zaktualizuj</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Wroc</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
