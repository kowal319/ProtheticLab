<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <!-- Link Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        .card {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }

        .btn-group .btn {
            width: 100px;
        }

        .table th, .table td {
            text-align: center;
        }

        .btn-danger, .btn-info {
            width: 100px;
        }
    </style>
</head>
<div th:replace="admin/navbar ::header"></div>

<body>
<div th:replace="admin/navbar ::navbar"></div>
<br />
<div class="container mt-5">

    <!-- Users List -->
    <div class="row">
        <div class="10 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title">Lista Gabinetow</h3>
                </div>
                <div class ="card-body">
            <table class="table table-bordered table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nazwa gabinetu</th>
                    <th>Numer Telefonu</th>
                    <th>Operacje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.phoneNumber}"></td>
                    <td>
                        <div class="btn-group" role="group" aria-label="Operations">
                            <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i>D</button>
                        </form>
                        <a th:href="@{/users/userInfoAdmin/{id}(id=${user.id})}">
                            <button type="button" class="btn btn-info"><i class="fas fa-info-circle"></i>I</button>
                        </a>
                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-primary">
                                <i class="fas fa-edit"></i> Edytuj
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
    </div>
</div>

<!-- Link Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
