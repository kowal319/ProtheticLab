<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My History</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

    <style>
        .card {
                  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                  border-radius: 10px;
              }

              .table-hover tbody tr:hover {
                  background-color: #f1f1f1;
              }

              .btn-group .btn {
                  width: 100px;
              }

              .table th, .table td {
                  text-align: center;
              }
              .btn-danger, .btn-info {
             width: 100px;
         }
    </style>
</head>
<div th:replace="gabinet/navbar ::header"></div>

<body>
<div th:replace="gabinet/navbar ::navbar"></div>
<br />


<div class="container mt-5">
    <div class="row">
        <div class="col-md-10 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title">Lista zamówień</h3>
                </div>
                <div class="card-body">
                    <table class="table table-bordered table-hover">

                    <thead>
                <tr>
                    <th>Numer zamowienia</th>
                    <th>Opis</th>
                    <th>Data odbioru</th>
                    <th>Data zlecenia</th>
                    <th>Akcje</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.description}"></td>
                    <td th:text="${order.pickupDate}"></td>
                    <td th:text="${#temporals.format(order.created, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <div class="btn-group" role="group" aria-label="Operations">
                            <form th:action="@{/profile/myOrders/delete/{id}(id=${order.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i> D</button>
                            </form>
                            <a th:href="@{/profile/myOrders/orderDetails/{id}(id=${order.id})}">
                                <button type="button" class="btn btn-info"><i class="fas fa-info-circle"></i> I</button>
                            </a>
                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
    </div>
</div>

<!-- Add your scripts and other body elements here -->

</body>

</html>
