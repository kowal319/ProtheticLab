<!-- header.html -->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header">
  <title>Prothetic Lab</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
  <style>
    /* Custom Navbar Styling */
    .navbar {
      background-color: #FF7F50;
      padding: 15px 30px;
    }

    .navbar-brand {
      font-size: 26px;
      font-weight: bold;
      color: white;
    }

    .navbar-brand:hover {
      color: #ffe5cc;
    }

    .nav-link {
      color: white;
      font-size: 18px;
      margin-right: 20px;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #ffe5cc;
    }

    .nav-button {
      color: white;
      background: transparent;
      border: none;
      padding: 0;
      font-size: 18px;
    }

    .nav-button:hover {
      color: #ffe5cc;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" th:fragment="navbar">
  <a class="navbar-brand">Prothetic Lab</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/profile}">Mój profil</a>
      </li>


      <li class="nav-item">
        <!-- Logout link -->
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="nav-link btn btn-link" style="color: white; text-decoration: none;">Wyloguj się</button>
        </form>
      </li>
    </ul>
  </div>
</nav>
</body>
</html>
