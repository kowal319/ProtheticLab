<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .card-container {
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .user-details p {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .user-details-btns {
      margin-top: 20px;
    }

    .user-details-btns a {
      margin-right: 10px;
    }

    .btn-primary, .btn-secondary {
      border-radius: 8px;
    }
  </style>
</head>

<body>
<!-- Header -->
<div th:replace="gabinet/navbar ::header"></div>
<div th:replace="gabinet/navbar ::navbar"></div>

<!-- User Details Card -->
<div class="container">
  <div class="card-container">
    <div class="card">
      <h3 class="mb-4 text-center text-primary"><i class="fa fa-user-circle"></i> Profile</h3>

      <div class="user-details">
        <p><strong>Nazwa Gabinetu:</strong> <span th:text="${userDetails.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${userDetails.email}"></span></p>
        <p><strong>Adres:</strong> <span th:text="${userDetails.address}"></span></p>
        <p><strong>Godziny Otwarcia:</strong> <span th:text="${userDetails.openingHours}"></span></p>
      </div>

      <hr>

      <div class="user-details-btns d-flex justify-content-center">
        <a th:href="@{/profile/edit/{id}(id=${userDetails.id})}" class="btn btn-primary">
          <i class="fas fa-edit"></i> Edytuj/Uzupełnij Dane
        </a>
        <a th:href="@{/profile/addOrder}" class="btn btn-secondary">
          <i class="fas fa-plus-circle"></i> Złóż Zamówienie
        </a>
        <a th:href="@{/profile/myOrders}" class="btn btn-secondary">
          <i class="fas fa-list"></i> Moje Zamówienia
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap & FontAwesome Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>

</body>
</html>
